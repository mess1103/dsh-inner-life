<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Inner Life">
  <defs>
    <linearGradient id="il-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2f45"/>
      <stop offset="1" stop-color="#1b1e2e"/>
    </linearGradient>
    <linearGradient id="il-paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6efdf"/>
      <stop offset="1" stop-color="#e6d9bf"/>
    </linearGradient>
  </defs>

  <!-- 底：一枚安静的深色方块 -->
  <rect x="1" y="1" width="30" height="30" rx="8" fill="url(#il-bg)"/>

  <!-- 一张折起来的纸（日记），右下角折角 -->
  <path d="M8 7h12l5 5v13a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z" fill="url(#il-paper)"/>
  <path d="M20 7l5 5h-5z" fill="#cbb894"/>

  <!-- 纸上的横线：写过字，但看不清写了什么 -->
  <g stroke="#a8956f" stroke-width="1.3" stroke-linecap="round" opacity=".75">
    <path d="M10 15h9"/>
    <path d="M10 18h11"/>
    <path d="M10 21h6"/>
  </g>

  <!-- 锁孔：这是它自己不告诉你在哪的那页 -->
  <g transform="translate(22.5 21.5)">
    <circle r="4.6" fill="#2b2f45" opacity=".92"/>
    <circle r="1.5" cy="-0.9" fill="#f6efdf"/>
    <path d="M-0.55 0.2h1.1l0.45 2.9h-2z" fill="#f6efdf"/>
  </g>
</svg>
